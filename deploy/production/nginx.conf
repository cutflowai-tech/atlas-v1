server {
    listen 8080;
    server_name _;

    root /var/lib/waset-atlas/published/current;
    autoindex off;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store" always;

    location = / {
        return 302 /en/dashboard.html;
    }

    location /en/ {
        try_files $uri $uri/ =404;
    }

    location /ar/ {
        try_files $uri $uri/ =404;
    }

    # Only the two locale trees beneath published/current are public.
    location / {
        return 404;
    }
}
