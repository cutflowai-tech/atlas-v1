# Reasoning V3 live topology (REV/20 rollout; docs/REASONING-V3-LIVE-TOPOLOGY.md). Loaded together with compose.yaml and
# compose.reasoning.yaml:
#
#   docker compose --env-file /etc/waset-atlas/atlas.env --env-file /etc/waset-atlas/reasoning.env --project-directory /opt/waset-atlas/current \
#     -f deploy/production/compose.yaml -f deploy/production/compose.reasoning.yaml -f deploy/production/compose.reasoning-live.yaml ...
#
# - reasoning-db: the canonical Reasoning V3 PostgreSQL. Only on the internal `reasoning-db` network: no port, no outbound route.
# - reasoning-web: the production WSGI process (same image, hardening and env allow-list as reasoning-ops) (gunicorn atlas_reasoning.wsgi:application). It publishes one port on host loopback only,
#   for the host reverse proxy. Rollout, actor, allow-list, CSRF and Origin rules are the application's (atlas_reasoning.web_app).
# - reasoning-ops: unchanged command surface; it joins the database network and reads the published deterministic site read-only, so
#   `gate` runs on the server (REASONING-V3-PRODUCTION-ROLLOUT.md §2.3).
# - Profile-gated: `docker compose up` of compose.yaml still starts only atlas-web. Secrets only as read-only files.
services:
  reasoning-db:
    image: ${ATLAS_REASONING_DB_IMAGE:-postgres:17-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652}
    profiles: ["reasoning-live"]
    user: "999:999"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    shm_size: 128m
    environment:
      POSTGRES_DB: atlas_reasoning
      POSTGRES_USER: atlas_reasoning
      POSTGRES_PASSWORD_FILE: /run/secrets/reasoning_db_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - type: bind
        source: ${ATLAS_REASONING_HOST_DB_DIR:-/var/lib/waset-atlas-reasoning/postgres}
        target: /var/lib/postgresql/data
      - type: bind
        source: ${ATLAS_REASONING_HOST_DB_PASSWORD_FILE:-/etc/waset-atlas/secrets/reasoning_db_password}
        target: /run/secrets/reasoning_db_password
        read_only: true
    tmpfs:
      - /var/run/postgresql:size=1m,mode=2775,uid=999,gid=999
      - /tmp:size=32m,mode=1777
    networks:
      - reasoning-db
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "atlas_reasoning", "-d", "atlas_reasoning"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  reasoning-ops:
    networks:
      - default
      - reasoning-db
    volumes:
      - type: bind
        source: ${ATLAS_HOST_DATA_DIR:-/var/lib/waset-atlas}
        target: /var/lib/waset-atlas
        read_only: true

  reasoning-web:
    image: ${ATLAS_REASONING_IMAGE:-waset-atlas-reasoning:production}
    profiles: ["reasoning-live"]
    user: "${ATLAS_UID:-10001}:${ATLAS_GID:-10001}"
    read_only: true
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    entrypoint: ["gunicorn"]
    command: ["--bind", "0.0.0.0:8080", "--workers", "2", "--threads", "4", "--timeout", "60", "--worker-tmp-dir", "/tmp",
              "--access-logfile", "-", "atlas_reasoning.wsgi:application"]
    # host loopback only -> container 8080; the host reverse proxy is the only client.
    ports:
      - "127.0.0.1:${ATLAS_REASONING_WEB_PORT:-18002}:8080"
    # The reasoning-ops allow-list (compose.reasoning.yaml), then the web-only settings.
    environment:
      ATLAS_REASONING_V3: ${ATLAS_REASONING_V3:-off}
      # `-on` (no colon): only an UNSET variable defaults to on; an explicitly blank value stays blank, which the application reads as
      # off (fail-safe for the processing kill switch). Operators still set `=off` explicitly.
      ATLAS_REASONING_EXECUTION: ${ATLAS_REASONING_EXECUTION-on}
      ATLAS_REASONING_AUDIENCE: ${ATLAS_REASONING_AUDIENCE:-none}
      ATLAS_REASONING_CARDS_PRIMARY: ${ATLAS_REASONING_CARDS_PRIMARY:-off}
      ATLAS_REASONING_HUMAN_CONTEXT: ${ATLAS_REASONING_HUMAN_CONTEXT:-off}
      ATLAS_REASONING_EXECUTIVE_HOME: ${ATLAS_REASONING_EXECUTIVE_HOME:-off}
      ATLAS_REASONING_MODEL: ${ATLAS_REASONING_MODEL:-}
      ATLAS_REASONING_ALLOW_MODEL_OVERRIDE: ${ATLAS_REASONING_ALLOW_MODEL_OVERRIDE:-off}
      ATLAS_REASONING_DATABASE_URL_FILE: /run/secrets/reasoning_database_url
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
      ATLAS_REASONING_MEMORY: ${ATLAS_REASONING_MEMORY:-off}
      ATLAS_REASONING_ENVIRONMENT: ${ATLAS_REASONING_ENVIRONMENT:-production}
      HONCHO_API_KEY_FILE: /run/secrets/honcho_api_key
      ATLAS_REASONING_LLM_TIMEOUT_SECONDS: ${ATLAS_REASONING_LLM_TIMEOUT_SECONDS:-120}
      ATLAS_REASONING_LLM_MAX_RETRIES: ${ATLAS_REASONING_LLM_MAX_RETRIES:-3}
      ATLAS_REASONING_LLM_BACKOFF_SECONDS: ${ATLAS_REASONING_LLM_BACKOFF_SECONDS:-2}
      ATLAS_REASONING_LLM_MAX_BACKOFF_SECONDS: ${ATLAS_REASONING_LLM_MAX_BACKOFF_SECONDS:-60}
      ATLAS_REASONING_LLM_CONCURRENCY: ${ATLAS_REASONING_LLM_CONCURRENCY:-4}
      ATLAS_REASONING_RUN_CALL_BUDGET: ${ATLAS_REASONING_RUN_CALL_BUDGET:-200}
      ATLAS_REASONING_EXECUTIVE_CALL_BUDGET: ${ATLAS_REASONING_EXECUTIVE_CALL_BUDGET:-3}
      ATLAS_REASONING_BREAKER_THRESHOLD: ${ATLAS_REASONING_BREAKER_THRESHOLD:-5}
      ATLAS_REASONING_BREAKER_COOLDOWN_SECONDS: ${ATLAS_REASONING_BREAKER_COOLDOWN_SECONDS:-60}
      ATLAS_REASONING_VALIDATION_RETRIES: ${ATLAS_REASONING_VALIDATION_RETRIES:-1}
      ATLAS_REASONING_MANAGERS: ${ATLAS_REASONING_MANAGERS:-}
      ATLAS_REASONING_ALLOWED_ORIGINS: ${ATLAS_REASONING_ALLOWED_ORIGINS:-}
      ATLAS_REASONING_ACTOR_HEADER: ${ATLAS_REASONING_ACTOR_HEADER:-}
      ATLAS_REASONING_CSRF_SECRET_FILE: /run/secrets/reasoning_csrf_secret
      ATLAS_REASONING_DIAGNOSTICS_URL: ${ATLAS_REASONING_DIAGNOSTICS_URL:-}
      ATLAS_REASONING_MONDAY_ITEM_URL: ${ATLAS_REASONING_MONDAY_ITEM_URL:-}
    volumes:
      - type: bind
        source: ${ATLAS_REASONING_HOST_DATABASE_URL_FILE:-/etc/waset-atlas/secrets/reasoning_database_url}
        target: /run/secrets/reasoning_database_url
        read_only: true
      - type: bind
        source: ${ATLAS_REASONING_HOST_OPENROUTER_KEY_FILE:-/etc/waset-atlas/secrets/openrouter_api_key}
        target: /run/secrets/openrouter_api_key
        read_only: true
      - type: bind
        source: ${ATLAS_REASONING_HOST_HONCHO_KEY_FILE:-/etc/waset-atlas/secrets/honcho_api_key}
        target: /run/secrets/honcho_api_key
        read_only: true
      - type: bind
        source: ${ATLAS_REASONING_HOST_CSRF_SECRET_FILE:-/etc/waset-atlas/secrets/reasoning_csrf_secret}
        target: /run/secrets/reasoning_csrf_secret
        read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks:
      - default
      - reasoning-db
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8080), 3).close()"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  reasoning-db:
    internal: true
