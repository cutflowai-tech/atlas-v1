name: waset-atlas-production

services:
  atlas-web:
    image: ${ATLAS_WEB_IMAGE:-waset-atlas-web:production}
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    group_add:
      - "${ATLAS_GID:-10001}"
    ports:
      - "${ATLAS_HTTP_BIND:-127.0.0.1}:${ATLAS_HTTP_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${ATLAS_HOST_DATA_DIR:-/var/lib/waset-atlas}
        target: /var/lib/waset-atlas
        read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    # nginx logs every request, including the 15-second image healthcheck; keep the container log bounded.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  atlas-runtime:
    image: ${ATLAS_APP_IMAGE:-waset-atlas-app:production}
    profiles: ["operations"]
    user: "${ATLAS_UID:-10001}:${ATLAS_GID:-10001}"
    read_only: true
    init: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      ATLAS_DATA_DIR: /var/lib/waset-atlas
      ATLAS_HISTORY_START: ${ATLAS_HISTORY_START:-2026-02-01T00:00:00Z}
      ATLAS_SYNC_INTERVAL_SECONDS: ${ATLAS_SYNC_INTERVAL_SECONDS:-3600}
      ATLAS_STALE_AFTER_SECONDS: ${ATLAS_STALE_AFTER_SECONDS:-7200}
      ATLAS_MAX_CONSECUTIVE_FAILURES: ${ATLAS_MAX_CONSECUTIVE_FAILURES:-3}
      ATLAS_SYNC_MAX_DURATION_SECONDS: ${ATLAS_SYNC_MAX_DURATION_SECONDS:-7200}
      ATLAS_CONTRACT_VERSION: ${ATLAS_CONTRACT_VERSION:-1.4.0}
      ATLAS_MONDAY_BOARD_ID: ${ATLAS_MONDAY_BOARD_ID:-5091110326}
      MONDAY_API_VERSION: ${MONDAY_API_VERSION:-2025-04}
      MONDAY_API_TOKEN_FILE: /run/secrets/monday_api_token
    volumes:
      - type: bind
        source: ${ATLAS_HOST_DATA_DIR:-/var/lib/waset-atlas}
        target: /var/lib/waset-atlas
      - type: bind
        source: ${ATLAS_TOKEN_FILE:-/etc/waset-atlas/secrets/monday_api_token}
        target: /run/secrets/monday_api_token
        read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    # Opt-in only. `docker compose up` starts atlas-web, never this service.
    # systemd overrides this safe read-only command with one scheduled-run.
    command: ["status", "--json"]
