# Host reverse proxy for https://atlas.wasetco.com (installed on the host, not in a container).
#
# Atlas publishes per-Editor performance evaluations. They must never be readable without
# authentication. This template puts HTTP basic authentication in front of the loopback-only
# Atlas web container (127.0.0.1:18000). Replace basic auth with SSO (oauth2-proxy,
# Cloudflare Access) when available; the unauthenticated-access check in
# `scripts/check-public-access` must keep passing either way.
#
# Install (see docs/PRODUCTION-RUNBOOK.md §4a):
#   sudo install -o root -g www-data -m 0640 /dev/null /etc/nginx/atlas.htpasswd
#   sudo htpasswd -B /etc/nginx/atlas.htpasswd MANAGER_NAME
#   sudo install -o root -g root -m 0644 deploy/production/host-proxy.nginx.conf /etc/nginx/sites-available/atlas
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name atlas.wasetco.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name atlas.wasetco.com;

    ssl_certificate     /etc/letsencrypt/live/atlas.wasetco.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atlas.wasetco.com/privkey.pem;

    server_tokens off;

    # Authentication is mandatory for every path, including / and the locale roots.
    auth_basic "Atlas";
    auth_basic_user_file /etc/nginx/atlas.htpasswd;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options DENY always;

    location / {
        proxy_pass http://127.0.0.1:18000;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
    }
}
