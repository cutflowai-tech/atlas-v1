name: Atlas CI

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
  push:
    branches: [main, integration]

jobs:
  main-promotion-policy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Require an integration-to-main pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          gh api "repos/$REPOSITORY/commits/$SHA/pulls" \
            --jq 'any(.[]; .base.ref == "main" and .head.ref == "integration" and .merged_at != null)' \
            | grep -qx true

  verify:
    runs-on: ubuntu-latest
    services:
      # Disposable PostgreSQL for the Reasoning V3 state tests (make reasoning); nothing else uses it.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas-ci-only
          POSTGRES_DB: atlas_reasoning_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_reasoning_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install verification dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Unit tests
        run: make unit
      - name: Contract and fixture tests
        run: make contract
      - name: Integration tests
        run: make integration
      - name: End-to-end control-plane test
        run: make e2e
      - name: Runtime contract tests
        run: make runtime
      - name: Normalization tests
        run: make normalization
      - name: Identity tests
        run: make identity
      - name: Monday probe tests
        run: make monday-probe
      - name: Video Type cohort tests
        run: make video-type
      - name: Work cycle and metric tests
        run: make cycles-metrics
      - name: Status normalization and source tests
        run: make status-sources
      - name: Quality and revision context tests
        run: make quality
      - name: Contract 1.5 intelligence framework tests
        run: make intelligence-v15
      - name: Intelligence V2 investigation layer tests
        run: make intelligence-v2
      - name: Round 4 distribution analysis tests
        run: make round4-analysis
      - name: Contract 1.3.0 tests
        run: make contract-v13
      - name: Contract 1.5.0 configuration and identity tests
        run: make contract-v15
      - name: Contract 1.4 output and operations unchanged by 1.5 code
        run: make contract-v14-compat
      - name: Contract 1.5 profile semantics and publication parity tests
        run: make profile-publication-v15
      - name: Contract 1.5 evidence, history, bilingual rendering and publication identity tests
        run: make contract-v15-release
      - name: Deadline v1.2 (ETA frozen at Ready For Approval) tests
        run: make deadline-v12
      - name: Editor Profile tests
        run: make profile
      - name: CEO Dashboard tests
        run: make dashboard
      - name: Read-only ingestion tests
        run: make ingest
      - name: Sync configuration and secrets tests
        run: make sync-config
      - name: Hardened Monday client tests
        run: make monday-client
      - name: Production ingestion run tests
        run: make ingest-runs
      - name: One-shot sync orchestration tests
        run: make sync-run
      - name: Atomic publish and rollback tests
        run: make publish
      - name: Production lock tests
        run: make lock
      - name: Arabic and English presentation tests
        run: make i18n
      - name: Contract 1.5 Editors app UI tests (including Intelligence V2, EN/AR)
        run: make ui-v15
      - name: Redesign snapshot, verdict engine and judgment-first UI tests
        run: make redesign
      # The Phase 20-B isolated restore drill needs pg_dump/pg_restore at least as new as the postgres:17 service; the runner's own
      # client is older. Install the matching client from the official PostgreSQL (PGDG) apt repository via postgresql-common's script.
      - name: PostgreSQL 17 client for the isolated restore drill
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/pg_restore --version
      - name: Reasoning V3 foundation tests (boundary, contracts, state, identity, change gate, gateway)
        env:
          ATLAS_REASONING_TEST_DATABASE_URL: postgresql://atlas:atlas-ci-only@localhost:5432/atlas_reasoning_test
          ATLAS_REASONING_REQUIRE_DB_TESTS: "1"
          # The restore drill must run here (a skip is a failure); with the PostgreSQL 17 client tools installed above.
          ATLAS_REASONING_REQUIRE_RESTORE_DRILL: "1"
          ATLAS_RESTORE_DRILL_PG_BIN: /usr/lib/postgresql/17/bin
        run: make reasoning
      - name: Status dashboard UI tests
        run: make status-ui
      - name: Sync status and data health tests
        run: make sync-status
      - name: Scheduled cycle tests
        run: make scheduled-run
      - name: Alert state tests
        run: make alerts
      - name: Bounded retention tests
        run: make retention
      - name: Production container asset tests
        run: make production-container
      - name: Production deployment unit tests
        run: make production-deploy
      - name: JSON syntax
        run: make json
