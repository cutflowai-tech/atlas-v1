name: Atlas CI

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
  push:
    branches: [main, integration]

jobs:
  main-promotion-policy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Require an integration-to-main pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          gh api "repos/$REPOSITORY/commits/$SHA/pulls" \
            --jq 'any(.[]; .base.ref == "main" and .head.ref == "integration" and .merged_at != null)' \
            | grep -qx true

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install verification dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Unit tests
        run: make unit
      - name: Contract and fixture tests
        run: make contract
      - name: Integration tests
        run: make integration
      - name: End-to-end control-plane test
        run: make e2e
      - name: Runtime contract tests
        run: make runtime
      - name: Normalization tests
        run: make normalization
      - name: Identity tests
        run: make identity
      - name: Monday probe tests
        run: make monday-probe
      - name: Video Type cohort tests
        run: make video-type
      - name: Work cycle and metric tests
        run: make cycles-metrics
      - name: Status normalization and source tests
        run: make status-sources
      - name: Quality and revision context tests
        run: make quality
      - name: Contract 1.3.0 tests
        run: make contract-v13
      - name: Deadline v1.2 (ETA frozen at Ready For Approval) tests
        run: make deadline-v12
      - name: Editor Profile tests
        run: make profile
      - name: Read-only ingestion tests
        run: make ingest
      - name: JSON syntax
        run: make json
